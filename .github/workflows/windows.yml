name: Windows

on:
  push:
    branches: [main]
    paths:
      - "usage.30s.py"
      - "doubaowork-quota.js"
      - "pricing.json"
      - "Tokei/**"
      - "tests/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "usage.30s.py"
      - "doubaowork-quota.js"
      - "pricing.json"
      - "Tokei/**"
      - "tests/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  collector:
    name: Collector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 采集脚本在干净的临时 HOME 里跑一遍所有入口：这是 Windows 版能用的底线。
      - name: Cross-platform smoke test
        run: python -m unittest tests.test_cross_platform_smoke -v
      - name: Windows privacy and credentials tests
        run: |
          python -m pip install cryptography==50.0.1
          python -m unittest tests.test_windows_native_bridge tests.test_windows_native_collector tests.test_windows_startup.StartupCollectorTests -v

  # 通用测试在三个平台执行；Swift/AppKit 检查只在 macOS 执行。
  # 全量测试失败会阻止 Windows 安装包构建。
  full-suite:
    name: Full test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - name: Install frontend test dependencies
        working-directory: windows
        run: pnpm install --frozen-lockfile
      - name: Install crypto test dependency
        run: python -m pip install cryptography==50.0.1
      - name: Full test suite
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests
      - name: Shared quota observer tests
        run: node --test tests/test_doubaowork_quota_js.cjs

  keychain-compatibility:
    name: Keychain upgrade (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic credential test dependency
        run: python -m pip install cryptography==50.0.1
      - name: Real Keychain ACL upgrade and no-prompt acceptance
        env:
          TOKEI_RUN_REAL_KEYCHAIN_TESTS: "1"
          TOKEI_KEYCHAIN_SOAK_SECONDS: "620"
          TOKEI_KEYCHAIN_REPORT_DIR: ${{ runner.temp }}/tokei-keychain-results
        run: python -m unittest tests.test_grok_bot_real_keychain -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-keychain-${{ matrix.os }}
          path: ${{ runner.temp }}/tokei-keychain-results
          if-no-files-found: error
          retention-days: 7

  app:
    name: App installer (windows-latest)
    needs: [collector, full-suite, keychain-compatibility]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 安装包自带 Python：官方 embeddable 包 + zstandard（读 Claude 桌面版额度缓存要用）。
      # 3.12 进入只修安全问题阶段后不再出二进制包，固定在最后一个带 embeddable 包的版本。
      - name: Embed Python runtime
        shell: pwsh
        env:
          EMBED_PYTHON: "3.12.10"
        run: |
          $version = $env:EMBED_PYTHON
          $target = "windows/src-tauri/python"
          Invoke-WebRequest "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath $target
          python -m pip install zstandard cryptography==50.0.1 --only-binary=:all: --platform win_amd64 --python-version 3.12 --implementation cp --target "$target/Lib/site-packages"
          $pth = Get-ChildItem $target -Filter "python*._pth" | Select-Object -First 1
          $lines = (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site'
          $lines + 'Lib\site-packages' | Set-Content $pth.FullName -Encoding ascii
          & "$target/python.exe" -c "import sqlite3, zstandard, ssl; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print('embedded python ok', sqlite3.sqlite_version)"

      # 用 cmd 重定向拿原始字节：PowerShell 管道会先按控制台代码页解码，中文就乱了。
      - name: Collector runs on the embedded runtime
        shell: cmd
        run: |
          windows\src-tauri\python\python.exe usage.30s.py --json --no-sync-snapshot > collector.json || exit /b 1
          python -c "import json; d = json.load(open('collector.json', encoding='utf-8')); print(sorted(d)[:6], len(d))"
          windows\src-tauri\python\python.exe usage.30s.py --json --no-sync-snapshot --local-only > preview.json || exit /b 1
          python -c "import json; d = json.load(open('preview.json', encoding='utf-8')); assert 'ranges' in d['codex']; print('local-first preview ok')"

      - name: Install frontend dependencies
        working-directory: windows
        run: pnpm install --frozen-lockfile

      - name: Native window and privacy tests
        working-directory: windows/src-tauri
        run: cargo test --locked --lib

      - name: Startup and shared usage regression tests
        run: python -m unittest tests.test_windows_startup tests.test_windows_usage_snapshot -v

      - name: Build installer
        working-directory: windows
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: tokei-windows-installer
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
